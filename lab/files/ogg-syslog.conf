# GoldenGate Microservices (ServiceManager, adminsrvr, distsrvr, recvsrvr, pmsrvr) log every REST request,
# including the full JSON body of each 401 challenge, to authpriv -> /var/log/secure grew ~200 MB a day on
# the node running a deployment. Kept as an access trail, but in its own file with its own rotation.
if $programname == ["ServiceManager","adminsrvr","distsrvr","recvsrvr","pmsrvr"] then {
    action(type="omfile" file="/var/log/ogg-http.log" fileCreateMode="0600")
    stop
}
