
##
##  For WebSocket connections, change the value for the 'Connection' request header to 'upgrade'.
##  Otherwise, leave it unchanged (or absent if 'Connection' is not in the original request).
##
map $http_upgrade $connection_upgrade {
    'websocket'   upgrade;
    default       $http_connection;
}

##
##  Upstream Service Manager
##
upstream _ServiceManager {
    server              127.0.0.1:9100;
    keepalive           8;
}

##
##  Upstream Servers for Deployment 'GG_B'
##
upstream GG_B_adminsrvr {
    server              127.0.0.1:9101;
    keepalive           8;
}
upstream GG_B_distsrvr {
    server              127.0.0.1:9102;
    keepalive           8;
}
upstream GG_B_pmsrvr {
    server              127.0.0.1:9104;
    keepalive           8;
}
upstream GG_B_recvsrvr {
    server              127.0.0.1:9103;
    keepalive           8;
}

server {
    listen                  443 ssl;
    listen             [::]:443 ssl;
    proxy_read_timeout      600s;
    proxy_buffer_size       16k;
    proxy_buffers           8 16k;
    ssl_certificate         /etc/nginx/ssl/ogg.pem;
    ssl_certificate_key     /etc/nginx/ssl/ogg.key;
    ssl_verify_client       optional_no_ca;
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_ciphers             HIGH:!aNULL:!MD5;
    ssl_session_cache       shared:SSL:5m;
    ssl_session_timeout     10m;
    ssl_session_tickets     off;
    proxy_ssl_protocols     TLSv1.2 TLSv1.3;
    proxy_ssl_session_reuse on;
    proxy_ssl_conf_command  Options ServerPreference;
    error_page 497 301 =307 https://$http_host$request_uri;

    ##
    ##  Deployment: GG_B (Default Deployment)
    ##  Service:    adminsrvr
    ##
    location ~ ^/GG_B/adminsrvr.*$ {
        proxy_set_header    X-OGG-Context               GG_B/adminsrvr;
        proxy_set_header    X-OGG-Deployment            GG_B;
        proxy_set_header    X-OGG-Service               adminsrvr;
        proxy_set_header    X-OGG-Version               $version;
        proxy_set_header    X-OGG-Resource              $resource;
        proxy_set_header    X-Real-IP                   $remote_addr;
        proxy_set_header    X-Forwarded-For             $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Host            $http_host;
        proxy_set_header    X-Forwarded-Proto           $scheme;
        proxy_set_header    X-Forwarded-Server          $hostname;
        proxy_set_header    X-SSL-Client-Verify         $ssl_client_verify;
        proxy_set_header    X-SSL-Client-I-DN           $ssl_client_i_dn;
        proxy_set_header    X-SSL-Client-S-DN           $ssl_client_s_dn;
        proxy_set_header    Upgrade                     $http_upgrade;
        proxy_set_header    Connection                  $connection_upgrade;
        proxy_set_header    Host                        $http_host;
        add_header          X-OGG-Proxy-Version         v1 always;
        add_header          Strict-Transport-Security  "max-age=31536000 ; includeSubDomains" always;
        proxy_pass          http://GG_B_adminsrvr;
        rewrite ^/GG_B/adminsrvr$    /GG_B/adminsrvr/ redirect;
        rewrite ^/GG_B/adminsrvr(.*) /$1 break;
    }
    location ~ ^/services/GG_B/adminsrvr(/(?<version>[^/]*)(/(?<resource>.*))?)?$ {
        proxy_set_header    X-OGG-Context               services/GG_B/adminsrvr;
